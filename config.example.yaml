upstream:
  # Douyin_TikTok_Download_API 地址
  base_url: "http://127.0.0.1:8899"
  # 上游请求超时（秒）
  timeout_seconds: 30

monitor:
  # 监控状态文件
  state_path: "data/monitor_users.json"
  # 下载目录
  download_root: "download"

notifications:
  telegram:
    # 是否开启 Telegram 提醒
    enabled: false
    # Bot Token (可用环境变量 DYMON_TG_BOT_TOKEN 覆盖)
    bot_token: ""
    # Chat ID (可用环境变量 DYMON_TG_CHAT_ID 覆盖)
    chat_id: ""
    # Telegram API 基地址
    api_base: "https://api.telegram.org"
    # 请求超时（秒）
    timeout_seconds: 10

instagram:
  # 是否启用 Instagram 监控
  enabled: false
  # Instagram 登录用户名（专用小号）
  login_user: ""
  # Session 文件路径
  session_file: "data/ig_session"
  # 监控状态文件
  state_path: "data/ig_monitor_users.json"
  # 下载目录
  download_root: "download/instagram"
  # 检查间隔（小时）
  check_interval_hours: 6
  # 请求间隔（秒），防限流
  request_delay_seconds: 8
