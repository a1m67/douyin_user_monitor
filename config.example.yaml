crawler:
  # 独立抖音 Web 爬虫配置（Cookie/headers），见 config/douyin_web.example.yaml
  config_path: "config/douyin_web.yaml"
  # 头像等直链下载超时（秒）
  timeout_seconds: 30

monitor:
  # 监控状态文件
  state_path: "data/monitor_users.json"
  # 下载目录
  download_root: "download"

notifications:
  telegram:
    # 是否开启 Telegram 提醒
    enabled: false
    # Bot Token (可用环境变量 DYMON_TG_BOT_TOKEN 覆盖)
    bot_token: ""
    # Chat ID (可用环境变量 DYMON_TG_CHAT_ID 覆盖)
    chat_id: ""
    # Telegram API 基地址
    api_base: "https://api.telegram.org"
    # 请求超时（秒）
    timeout_seconds: 10

  hermes_weixin:
    # 是否开启 Hermes 微信失效告警（SSH 到 ubuntu 执行 hermes send）
    enabled: false
    ssh_host: "hermes.example.test"
    ssh_user: "root"
    hermes_home: "/opt/hermes"
    hermes_bin: "/opt/hermes/bin/hermes"
    target: "weixin"
    timeout_seconds: 60

cookie_liveness:
  # 是否开启 Cookie 定时测活
  enabled: true
  # 测活间隔（小时）
  interval_hours: 6
  # 最新作品早于该天数视为过期信号
  stale_days: 7
  # 抽样用户数
  sample_user_count: 5
  # 最少成功样本数（不足则判定 unknown，不告警）
  min_samples: 3
  # 失效告警冷却（小时）
  alert_cooldown_hours: 12

