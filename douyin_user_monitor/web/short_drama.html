<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 短剧追更</title>
  <style>
    :root {
      --canvas: #f7f8fa;
      --surface: #ffffff;
      --ink: #17202a;
      --muted: #64707d;
      --line: #dce1e6;
      --nav: #183440;
      --nav-hover: #24505f;
      --accent: #0d7a75;
      --accent-soft: #dff3ed;
      --yellow: #b7791f;
      --yellow-soft: #fef3d8;
      --red: #b64646;
      --red-soft: #ffe5e5;
      --blue: #2169a7;
      --blue-soft: #e1f0fc;
      --radius: 6px;
      font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--canvas); color: var(--ink); font-size: 14px; }
    a { color: inherit; }
    button, input, select { font: inherit; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 224px minmax(0, 1fr); }
    .sidebar { background: var(--nav); color: #eaf2f3; padding: 18px 12px; display: flex; flex-direction: column; gap: 22px; }
    .brand { padding: 8px 10px; font-size: 18px; font-weight: 700; }
    .brand span { display: block; color: #a8c6cc; font-size: 12px; font-weight: 500; margin-top: 5px; }
    .nav { display: grid; gap: 4px; }
    .nav a { color: #c4d4d7; padding: 10px; text-decoration: none; border-radius: var(--radius); }
    .nav a:hover, .nav a.active { background: var(--nav-hover); color: #fff; }
    .nav a.review-link { display: flex; justify-content: space-between; align-items: center; }
    .count { background: #b7791f; color: #fff; border-radius: 10px; min-width: 20px; padding: 1px 6px; text-align: center; font-size: 12px; }
    .sidebar-footer { color: #a8c6cc; font-size: 12px; margin-top: auto; padding: 8px 10px; }
    .main { min-width: 0; }
    .topbar { min-height: 64px; padding: 14px clamp(16px, 3vw, 36px); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .topbar-title { font-size: 18px; font-weight: 700; }
    .system-state { color: var(--muted); font-size: 13px; }
    .page { max-width: 1400px; padding: 24px clamp(16px, 3vw, 36px) 48px; margin: 0 auto; }
    .page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    h1 { font-size: 24px; margin: 0; font-weight: 700; }
    .subtitle { color: var(--muted); margin: 6px 0 0; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
    .metric { padding: 16px; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric small { display: block; color: var(--muted); margin-bottom: 7px; }
    .metric strong { font-size: 22px; }
    .toolbar { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .field { display: grid; gap: 5px; color: var(--muted); font-size: 12px; }
    input, select { height: 36px; min-width: 140px; padding: 7px 9px; border: 1px solid var(--line); background: #fff; border-radius: 4px; color: var(--ink); }
    input:focus, select:focus { outline: 2px solid #9ed5cf; border-color: var(--accent); }
    button { min-height: 36px; padding: 7px 11px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; background: var(--accent); color: #fff; font-weight: 600; }
    button:hover { filter: brightness(.95); }
    button.secondary { background: #fff; color: var(--ink); border-color: var(--line); }
    button.danger { background: #fff; color: var(--red); border-color: #efb9b9; }
    button.small { min-height: 30px; padding: 4px 8px; font-size: 12px; }
    .show-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .show { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-height: 210px; padding: 16px; display: grid; grid-template-rows: auto 1fr auto; gap: 13px; }
    .show:hover { border-color: var(--accent); }
    .show.ignored { background: #f1f3f4; border-color: #c9d0d5; }
    .show h2 { font-size: 17px; margin: 0; line-height: 1.35; }
    .show-title-link { color: var(--ink); text-decoration: none; padding-right: 34px; }
    .show-title-link:hover { color: var(--accent); }
    .show-episode { color: var(--accent); font-weight: 700; font-size: 18px; }
    .show-progress-copy { display: grid; gap: 5px; color: var(--ink); line-height: 1.45; }
    .show-progress-copy .missing { color: var(--yellow); }
    .show-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; gap: 10px; }
    .show-menu { position: absolute; top: 10px; right: 10px; z-index: 2; }
    .show-menu summary { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; background: #fff; cursor: pointer; font-size: 20px; line-height: 1; list-style: none; }
    .show-menu summary::-webkit-details-marker { display: none; }
    .show-menu-panel { position: absolute; right: 0; top: 34px; min-width: 130px; padding: 5px; border: 1px solid var(--line); border-radius: 4px; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.14); display: grid; gap: 3px; }
    .show-menu-panel a, .show-menu-panel button { width: 100%; min-height: 32px; padding: 6px 8px; border: 0; background: #fff; color: var(--ink); text-align: left; text-decoration: none; font-weight: 500; }
    .show-menu-panel a:hover, .show-menu-panel button:hover { background: #f1f4f6; }
    .show-menu-panel button.danger { color: var(--red); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    table { width: 100%; border-collapse: collapse; min-width: 1280px; }
    th { background: #f1f4f6; color: #44515d; text-align: left; font-weight: 600; white-space: nowrap; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    .history-progress { min-width: 205px; display: grid; gap: 6px; }
    .history-progress-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
    .history-progress-head strong { color: var(--ink); font-size: 13px; }
    .history-progress-track { position: relative; height: 8px; overflow: hidden; background: #e5eaed; border-radius: 4px; }
    .history-progress-bar { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); }
    .history-progress-bar.pending { width: 18%; background: #70a6a1; }
    .history-progress-bar.running { width: 32%; animation: history-progress-indeterminate 1.45s ease-in-out infinite; }
    .history-progress-bar.paused { width: 32%; background: var(--yellow); }
    .history-progress-bar.failed { width: 32%; background: var(--red); }
    .history-progress-bar.completed { width: 100%; background: var(--blue); }
    .history-progress-detail { color: var(--muted); font-size: 12px; line-height: 1.35; }
    @keyframes history-progress-indeterminate { from { transform: translateX(-100%); } to { transform: translateX(315%); } }
    @media (prefers-reduced-motion: reduce) { .history-progress-bar.running { animation: none; } }
    .table-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .video-description { display: grid; gap: 4px; min-width: 260px; max-width: 420px; }
    .video-description .display-title { font-weight: 600; }
    .parser-evidence { display: grid; gap: 4px; min-width: 170px; color: var(--muted); font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; }
    .parser-evidence strong { color: var(--ink); font-weight: 600; }
    .account-editor td { background: #f7fbfa; }
    .account-edit-fields { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(220px, 2fr) minmax(130px, .6fr) auto; align-items: end; gap: 10px; }
    .badge { display: inline-block; padding: 3px 7px; border-radius: 3px; background: var(--accent-soft); color: #075b57; font-size: 12px; font-weight: 600; }
    .badge.paused { background: var(--yellow-soft); color: var(--yellow); }
    .badge.completed { background: var(--blue-soft); color: var(--blue); }
    .badge.pending, .badge.running { background: var(--accent-soft); color: #075b57; }
    .badge.failed { background: var(--red-soft); color: var(--red); }
    .badge.review { background: var(--yellow-soft); color: var(--yellow); }
    .badge.ignored { background: #eef1f3; color: #5b6670; }
    .empty { padding: 48px 20px; border: 1px dashed #bcc6cd; text-align: center; color: var(--muted); background: #fbfcfd; }
    .detail { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 20px; }
    .detail-main, .detail-side { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
    .detail-side { display: grid; align-content: start; gap: 10px; }
    .detail-side h2 { margin: 0; font-size: 16px; }
    .merge-show { display: grid; gap: 8px; margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
    .merge-show p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .episode-row { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .episode-row:last-child { border-bottom: 0; }
    .episode-row h3 { margin: 0 0 6px; font-size: 16px; }
    .source-list { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
    .source-list li { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    .show-library-filters { padding: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); }
    .missing-episodes { margin: 12px 0 0; padding: 10px 12px; border-left: 3px solid var(--yellow); background: #fffaf0; color: #76520f; font-size: 13px; }
    .review { display: grid; grid-template-columns: 70px minmax(0, 1fr) 300px; gap: 16px; padding: 16px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); margin-bottom: 12px; }
    .cover { width: 70px; height: 94px; background: #e8ecef; object-fit: cover; border-radius: 3px; }
    .review h2 { font-size: 16px; margin: 0 0 6px; }
    .desc { color: #3e4a55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .review-form { display: grid; grid-template-columns: 1fr 100px; gap: 8px; align-content: start; }
    .review-form input, .review-form select { min-width: 0; width: 100%; }
    .review-form .new-show { grid-column: 1 / -1; }
    .review-form button { grid-column: 1 / -1; }
    .review-select { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .review-select input { min-width: auto; width: 16px; height: 16px; }
    .status-layout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .panel { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px; }
    .panel h2 { margin: 0 0 14px; font-size: 16px; }
    .error-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
    .error-item:last-child { border-bottom: 0; }
    .notice { position: fixed; right: 20px; bottom: 20px; max-width: min(380px, calc(100vw - 40px)); background: #20313b; color: #fff; border-radius: var(--radius); padding: 12px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.18); display: none; }
    .notice.error { background: #8d3636; }
    .muted { color: var(--muted); }
    @media (max-width: 900px) { .shell { grid-template-columns: 1fr; align-content: start; } .sidebar { min-height: auto; display: block; overflow: visible; padding: 14px 12px; } .brand { min-width: 0; } .nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); } .nav a { white-space: normal; } .sidebar-footer { display: none; } .summary { grid-template-columns: repeat(2, 1fr); } .metric:nth-child(2) { border-right: 0; } .detail, .status-layout { grid-template-columns: 1fr; } .review { grid-template-columns: 55px 1fr; } .cover { width: 55px; height: 74px; } .review-form { grid-column: 1 / -1; } }
    @media (max-width: 560px) { .summary { grid-template-columns: 1fr; } .metric { border-right: 0; border-bottom: 1px solid var(--line); } .metric:last-child { border-bottom: 0; } .page-head { align-items: start; flex-direction: column; } .review { grid-template-columns: 1fr; } .cover { display: none; } .account-edit-fields { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">AI 短剧追更<span>Douyin episode tracker</span></div>
      <nav class="nav">
        <a href="/shows" data-nav="shows">最近更新</a>
        <a href="/accounts" data-nav="accounts">作者账号</a>
        <a href="/videos" data-nav="videos">作品记录</a>
        <a href="/review" class="review-link" data-nav="review">人工审核 <span class="count" id="reviewCount">0</span></a>
        <a href="/status" data-nav="status">系统状态</a>
      </nav>
      <div class="sidebar-footer" id="sidebarStatus">加载系统状态</div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="topbar-title" id="topTitle">AI 短剧追更</div><div class="system-state" id="systemState"></div></header>
      <section class="page" id="app"></section>
    </main>
  </div>
  <div class="notice" id="notice" role="status"></div>
  <script>
    const API = "/api/short-drama";
    const app = document.getElementById("app");
    const notice = document.getElementById("notice");
    const route = location.pathname;
    let showOptions = [];
    let editingAccountId = null;
    let selectedReviewIds = new Set();
    let accountRefreshTimer = null;
    const showLibraryFilters = {accountId:"", ignored:"normal", q:"", sort:"recent"};

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char]));
    }
    function formatTime(value, fallback = "-") {
      if (!value) return fallback;
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return new Intl.DateTimeFormat("zh-CN", { timeZone: "Asia/Shanghai", hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).format(date);
    }
    function message(text, isError = false) {
      notice.textContent = text;
      notice.className = isError ? "notice error" : "notice";
      notice.style.display = "block";
      setTimeout(() => { notice.style.display = "none"; }, 3500);
    }
    async function request(path, options = {}) {
      const response = await fetch(API + path, { headers: { "Content-Type": "application/json", ...(options.headers || {}) }, ...options });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || "请求失败");
      return data;
    }
    function nav(name, title) {
      document.querySelectorAll("[data-nav]").forEach(item => item.classList.toggle("active", item.dataset.nav === name));
      document.getElementById("topTitle").textContent = title;
    }
    async function refreshStatus() {
      try {
        const status = await request("/status");
        document.getElementById("reviewCount").textContent = status.pending_review;
        document.getElementById("sidebarStatus").textContent = `调度：${status.scheduler} · 上次巡检：${formatTime(status.last_check_at, "未开始")}`;
        document.getElementById("systemState").textContent = `${status.enabled_accounts}/${status.accounts} 个账号启用`;
        return status;
      } catch (error) {
        document.getElementById("sidebarStatus").textContent = "系统状态不可用";
        return null;
      }
    }
    function empty(text) { return `<div class="empty">${escapeHtml(text)}</div>`; }
    function statusBadge(status) { return `<span class="badge ${escapeHtml(status)}">${escapeHtml({updating:"追更中", completed:"已完结", paused:"已暂停"}[status] || status)}</span>`; }
    function classificationBadge(status) { return `<span class="badge ${escapeHtml(status)}">${escapeHtml({matched:"已匹配", ignored:"已忽略", review:"待审核"}[status] || status)}</span>`; }
    function historyStatusBadge(status) { return `<span class="badge ${escapeHtml(status)}">${escapeHtml({idle:"未开始", pending:"等待执行", running:"补全中", paused:"已暂停", completed:"历史扫描完成", failed:"补全失败"}[status] || status)}</span>`; }
    function historyProgress(history) {
      const status = String(history.status || "idle");
      const processedPages = Math.max(0, Number(history.processed_pages) || 0);
      const scannedItems = Math.max(0, Number(history.scanned_items) || 0);
      const newVideos = Math.max(0, Number(history.new_videos) || 0);
      const completed = status === "completed" || (status !== "idle" && history.has_more === false);
      const progressStatus = completed ? "completed" : ["pending", "running", "paused", "failed"].includes(status) ? status : "idle";
      const state = completed ? "已完成" : ({idle:"未开始", pending:"等待执行", running:"总页数未知，仍有下一页", paused:"已暂停，可继续", failed:"补全失败，可继续重试"}[status] || status);
      const detail = status === "idle"
        ? "尚未开始历史扫描"
        : `${completed ? "共扫描" : "已扫描"} ${processedPages} 页 · ${scannedItems} 条作品 · 新增 ${newVideos} 条${completed ? "" : "；抖音未提供历史总页数"}`;
      const ariaText = `历史补全${state}，${detail}`;
      const progressLabel = completed ? "100%" : status === "idle" ? "0%" : "总量未知";
      const ariaValue = completed ? " aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"100\"" : status === "idle" ? " aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"0\"" : " aria-valuetext=\"总页数未知\"";
      return `<div class="history-progress" data-history-progress="${escapeHtml(progressStatus)}"><div class="history-progress-head"><strong>${progressLabel}</strong><span>${escapeHtml(state)}</span></div><div class="history-progress-track" role="progressbar" aria-label="${escapeHtml(ariaText)}"${ariaValue}><span class="history-progress-bar ${escapeHtml(progressStatus)}"></span></div><div class="history-progress-detail">${escapeHtml(detail)}</div></div>`;
    }
    function contentTypeLabel(type) { return {episode:"正式剧集", trailer:"预告/先行", show_content:"短剧内容", unknown:"待判断", non_drama:"普通视频"}[type] || type || "-"; }
    function videoDescription(video) {
      const displayTitle = String(video.display_title || "").trim();
      const description = String(video.description || "").trim();
      const title = displayTitle || description || "（无描述）";
      const rawDescription = displayTitle && description && displayTitle !== description ? `<span class="muted">描述：${escapeHtml(description)}</span>` : "";
      return `<div class="video-description"><a class="display-title" href="${escapeHtml(video.video_url)}" target="_blank" rel="noreferrer">${escapeHtml(title)}</a>${rawDescription}<span class="muted">${escapeHtml(video.hashtags.join(" #"))}</span></div>`;
    }
    function parserEvidence(evidence) {
      const entries = [["剧名", evidence && evidence.show], ["集数", evidence && evidence.episode]].filter(([, item]) => item && item.value);
      if (!entries.length) return `<span class="muted">暂无证据</span>`;
      return `<div class="parser-evidence">${entries.map(([label, item]) => `<span><strong>${escapeHtml(label)}：</strong>${escapeHtml(item.value)}<br />来源：${escapeHtml(item.source_field || "-")}</span>`).join("")}</div>`;
    }
    function reviewJudgements(video) {
      const evidence = video.parser_evidence || {};
      const regex = evidence.regex_result || {};
      const ai = evidence.llm_result || {};
      const regexText = regex.reason || (video.parser_method === "llm" ? "-" : video.parser_reason) || "-";
      const aiEpisode = ai.episode_number === null || ai.episode_number === undefined ? "" : ` · 第${ai.episode_number}集`;
      const aiText = ai.error ? `调用失败（${ai.error}）` : ai.show_title ? `${ai.show_title}${aiEpisode}` : contentTypeLabel(ai.content_type);
      const confidence = typeof ai.confidence === "number" ? `${Math.round(ai.confidence * 100)}%` : "-";
      return `<div class="parser-evidence"><span><strong>规则：</strong>${escapeHtml(regexText)}</span><span><strong>AI：</strong>${escapeHtml(aiText || "-")}<br /><strong>置信度：</strong>${escapeHtml(confidence)}<br /><strong>原因：</strong>${escapeHtml(ai.reason || ai.error || "-")}</span></div>`;
    }

    async function renderShows() {
      nav("shows", "短剧库");
      const params = new URLSearchParams({ignored:showLibraryFilters.ignored, sort:showLibraryFilters.sort, limit:"500"});
      if (showLibraryFilters.accountId) params.set("account_id", showLibraryFilters.accountId);
      if (showLibraryFilters.q) params.set("q", showLibraryFilters.q);
      if (showLibraryFilters.ignored !== "normal") params.set("include_empty", "true");
      const [data, accountsData] = await Promise.all([request(`/shows?${params}`), request("/accounts")]);
      const accountOptions = accountsData.accounts.map(account => `<option value="${escapeHtml(account.id)}" ${showLibraryFilters.accountId === account.id ? "selected" : ""}>${escapeHtml(account.nickname)}</option>`).join("");
      const cards = data.shows.map(show => {
        const latest = show.latest_episode === null || show.latest_episode === undefined ? "尚无剧集" : `更新至 第${show.latest_episode}集`;
        const complete = show.regular_episode_count > 0 && show.min_episode === 1 && show.missing_episode_count === 0 && show.regular_episode_count === show.latest_episode;
        let collected = show.expected_episode_count ? `正片 ${show.regular_episode_count} / ${show.expected_episode_count} 集` : show.special_episode_count ? `正片 ${show.regular_episode_count} 集` : `已收录 ${show.episode_count} 集`;
        if (show.special_episode_count) collected += ` · 先导/特殊 ${show.special_episode_count}`;
        else if (complete) collected += " · 完整";
        const missing = show.missing_episode_count ? `<span class="missing">缺 ${show.missing_episode_count} 集</span>` : "";
        const authorExtra = Math.max(0, Number(show.source_account_count || 0) - 1);
        const author = `${show.latest_account_nickname || show.source_accounts?.[0]?.nickname || "-"}${authorExtra ? ` +${authorExtra}` : ""}`;
        const action = show.is_ignored
          ? `<button onclick="restoreShow(${show.id})">恢复追踪</button>`
          : `<button class="danger" onclick="ignoreShow(${show.id}, ${escapeHtml(JSON.stringify(show.title))})">永久忽略</button>`;

lue="${candidate.id}">${escapeHtml(candidate.title)}</option>`).join("")}</select></label><button class="danger" onclick="mergeShow(${show.id})" ${mergeSources.length ? "" : "disabled"}>合并到当前短剧</button></div></aside></div>`;

    function acceptAISuggestion(videoId, showId, episodeNumber) { document.getElementById(`reviewShow-${videoId}`).value=String(showId); document.getElementById(`reviewNewShow-${videoId}`).value=""; document.getElementById(`reviewEpisode-${videoId}`).value=String(episodeNumber); message("已填入 AI 建议，请确认后归档"); }
    function toggleReviewSelection(id, checked) { if (checked) selectedReviewIds.add(id); else selectedReviewIds.delete(id); updateReviewBulkAction(); }
    function toggleAllReviews(checked) { document.querySelectorAll("[data-review-checkbox]").forEach(checkbox => { const id=Number(checkbox.dataset.reviewCheckbox); checkbox.checked=checked; if(checked) selectedReviewIds.add(id); else selectedReviewIds.delete(id); }); updateReviewBulkAction(); }
    function updateReviewBulkAction() { const ids=[...document.querySelectorAll("[data-review-checkbox]")].filter(checkbox=>checkbox.checked).map(checkbox=>Number(checkbox.dataset.reviewCheckbox)); selectedReviewIds=new Set(ids); const button=document.getElementById("batchIgnoreReviews"); if(button) { button.disabled=!ids.length; button.textContent=ids.length ? `批量忽略（${ids.length}）` : "批量忽略"; } const selectAll=document.getElementById("selectAllReviews"); if(selectAll) selectAll.checked=ids.length>0 && ids.length===document.querySelectorAll("[data-review-checkbox]").length; }
    async function ignoreReview(videoId) { try { await request(`/reviews/${videoId}/ignore`, {method:"POST"}); selectedReviewIds.delete(videoId); message("已忽略该作品"); await renderReview(); await refreshStatus(); } catch(error) { message(error.message, true); } }
    async function ignoreSelectedReviews() { const videoIds=[...selectedReviewIds]; if(!videoIds.length || !confirm(`忽略已选择的 ${videoIds.length} 条作品？`)) return; try { const result=await request("/reviews/batch-ignore", {method:"POST", body:JSON.stringify({video_ids:videoIds})}); selectedReviewIds=new Set(); message(`已忽略 ${result.ignored_count} 条作品`); await renderReview(); await refreshStatus(); } catch(error) { message(error.message, true); } }
    async function renderStatus() { nav("status", "系统状态"); const status=await refreshStatus(); if(!status) { app.innerHTML=empty("状态不可用"); return; } app.innerHTML=`<div class="page-head"><div><h1>系统状态</h1><p class="subtitle">数据库、调度和最近巡检情况</p></div><button class="secondary" onclick="renderStatus()">刷新</button></div><div class="summary"><div class="metric"><small>账号总数</small><strong>${status.accounts}</strong></div><div class="metric"><small>启用账号</small><strong>${status.enabled_accounts}</strong></div><div class="metric"><small>短剧数量</small><strong>${status.shows}</strong></div><div class="metric"><small>待审核</small><strong>${status.pending_review}</strong></div></div><div class="status-layout"><section class="panel"><h2>运行状态</h2><p>数据库：正常</p><p>日常调度：${escapeHtml(status.scheduler)}</p><p>历史补全：${escapeHtml(status.history_backfill_worker || "not_started")}</p><p>最近一次巡检：${formatTime(status.last_check_at, "未开始")}</p><p>通知渠道：${escapeHtml(status.enabled_notification_channels.join("、") || "未配置")}</p></section><section class="panel"><h2>最近错误</h2>${status.recent_errors.length ? status.recent_errors.map(error=>`<div class="error-item"><strong>${escapeHtml(error.nickname)}</strong><br><span class="muted">${escapeHtml(error.last_error)} · 连续失败 ${error.consecutive_failures}</span></div>`).join("") : '<p class="muted">暂无账号错误</p>'}</section></div>`; }
    async function boot() { await refreshStatus(); try { const match=route.match(/^\/shows\/(\d+)$/); if(match) return renderShowDetail(match[1]); if(route==="/accounts") return renderAccounts(); if(route==="/videos") return renderVideos(); if(route==="/review") return renderReview(); if(route==="/status") return renderStatus(); return renderShows(); } catch(error) { app.innerHTML=empty(error.message); } }
    boot();
  </script>
</body>
</html>
