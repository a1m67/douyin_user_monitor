# OpenList API 地址
API_URL="http://127.0.0.1:5244"

# OpenList SQLite 数据库（用于读取 API token）
OPENLIST_DB="/opt/openlist/data/data.db"

# douyin_user_monitor 本地下载目录
SOURCE_ROOT="/root/douyin_user_monitor/download"

# OpenList 内部可访问的同一目录
SOURCE_MOUNT="/qbt/douyin_user_monitor/download"

# 目标网盘目录
TARGET_BASE="/kuake/抖音视频"

# 保留 SOURCE_ROOT 下的用户目录结构
STRIP_PREFIX_DIR=""

# 文件最小静置时间（秒）
MIN_AGE_SECONDS=120

# 最大 pending 移动任务数；达到后本轮只做对账，不提交新任务
MAX_PENDING_TASKS=2000

# 多小文件场景：同一源目录到同一目标目录的文件批量提交
MOVE_BATCH_SIZE=50

# 每轮 timer 的工作上限，避免单次 oneshot 长时间占用
MAX_NEW_FILES_PER_RUN=500
MAX_RECONCILE_FILES_PER_RUN=1000

# 提交后不逐文件等待远端即时可见，由后续轮次批量对账收口
VERIFY_AFTER_MOVE="false"

# 同一轮内缓存远端目录列表，减少 Quark refresh 次数
REMOTE_LIST_CACHE_ENABLED="true"

# true 仅打印计划，不执行移动
DRY_RUN="false"

# 保留原始文件名
SANITIZE_EMOJI="false"

# 匹配全部文件
FILE_PATTERN="*"

# 目标已有同名但大小不一致时跳过冲突文件并继续处理后续文件
SKIP_CONFLICTING_FILES="true"
SKIPPED_FILE="/root/douyin_user_monitor/runtime/.openlist-auto-move-douyin-monitor.skipped"

# 独立锁与 pending/skipped，避免与其他移动任务互相影响
LOCK_FILE="/root/douyin_user_monitor/runtime/.openlist-auto-move-douyin-monitor.lock"
PENDING_FILE="/root/douyin_user_monitor/runtime/.openlist-auto-move-douyin-monitor.pending"
